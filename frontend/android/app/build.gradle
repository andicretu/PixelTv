apply plugin: "com.android.application"

// Classic RN setup – bundles your JS via react.gradle
project.ext.react = [
        entryFile: "index.js",
        enableHermes: false   // ← uses JSC so no libhermes.so error
]

android {
    namespace "com.pixeltv"
    compileSdkVersion rootProject.ext.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // ensure JNI libs from Hermes are included
            jniLibs.srcDirs += ["src/main/jniLibs",
                                "../../node_modules/hermes-engine/android/hermes-release/jni"]
        }
    }

    packagingOptions {
        pickFirst "lib/**/libc++_shared.so"
    }

    defaultConfig {
        applicationId "com.pixeltv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile    file("my-release-key.jks")
            storePassword "pixeltvandroidapp"
            keyAlias      "my-key-alias"
            keyPassword   "pixeltvandroidapp"
        }
    }

    buildTypes {
        release {
            signingConfig    signingConfigs.release
            minifyEnabled    false
            proguardFiles    getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android:0.73.5")
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation("org.webkit:android-jsc:r216113")
    implementation project(":react-native-webview")
}

configurations.all {
    resolutionStrategy {
        force 'org.webkit:android-jsc:r216113'
    }
}

// This wires up project.ext.react above to run the bundle task
apply from: "../../node_modules/react-native/react.gradle"
