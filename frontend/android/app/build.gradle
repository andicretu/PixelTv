plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.facebook.react")
}


project.ext.react = [
        entryFile: "index.js",
        enableHermes: false  // using JSC, so no libhermes.so needed
]

android {
    namespace "com.pixeltv"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.pixeltv"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Kotlin compiler target
    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs += [
                    "src/main/jniLibs",
                    "../../node_modules/hermes-engine/android/hermes-release/jni"
            ]
        }
    }

    packagingOptions {
        pickFirst "lib/**/libc++_shared.so"
    }

    signingConfigs {
        release {
            storeFile     file("my-release-key.jks")
            storePassword "pixeltvandroidapp"
            keyAlias      "my-key-alias"
            keyPassword   "pixeltvandroidapp"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // React Native runtime AAR from Maven Central
    implementation "com.facebook.react:react-android:0.73.5"
    // Your autolinked WebView module
    implementation project(":react-native-webview")
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation fileTree(dir: "libs", include: ["*.jar"])
    // JSC AAR
    implementation "org.webkit:android-jsc:r216113"
    implementation 'org.jetbrains:annotations:16.0.2'
}

configurations.all {
    resolutionStrategy {
        force "org.webkit:android-jsc:r216113"
    }
}

afterEvaluate {
    // Ensure bundleReleaseJsAndAssets waits for the webview’s resources
    tasks.matching { it.name == "bundleReleaseJsAndAssets" }.configureEach {
        dependsOn(":react-native-webview:generateReleaseBuildConfig")
        dependsOn(":react-native-webview:packageReleaseResources")
        dependsOn(":react-native-webview:processReleaseManifest")
        dependsOn(":react-native-webview:writeReleaseAarMetadata")
        dependsOn(":react-native-webview:javaPreCompileRelease")
        dependsOn(":react-native-webview:generateReleaseRFile")
        dependsOn(":react-native-webview:mergeReleaseJniLibFolders")
        dependsOn(":react-native-webview:mergeReleaseShaders")
        dependsOn(":react-native-webview:copyReleaseJniLibsProjectAndLocalJars")
        dependsOn(":react-native-webview:packageReleaseAssets")
        dependsOn(":react-native-webview:prepareReleaseArtProfile")
        dependsOn(":react-native-webview:prepareLintJarForPublish")
        dependsOn(":react-native-webview:extractDeepLinksForAarRelease")
        dependsOn(":react-native-webview:compileReleaseKotlin")
        dependsOn(":react-native-webview:compileReleaseJavaWithJavac")
        dependsOn(":react-native-webview:extractReleaseAnnotations")
        dependsOn(":react-native-webview:mergeReleaseGeneratedProguardFiles")
        dependsOn(":react-native-webview:mergeReleaseJavaResource")
        dependsOn(":react-native-webview:processReleaseJavaRes")
        dependsOn(":react-native-webview:syncReleaseLibJars")
        dependsOn(":react-native-webview:mergeReleaseConsumerProguardFiles")
        dependsOn(":react-native-webview:bundleReleaseLocalLintAar")
    }

    tasks.matching { it.name == "compressReleaseAssets" }.configureEach {
        mustRunAfter("copyReleaseBundledJs")
    }
}
// Run the RN bundling step
apply from: "../../node_modules/react-native/react.gradle"
