pluginManagement {
        repositories {
                gradlePluginPortal()    // for community plugins
                google()                // Android Gradle Plugin
                mavenCentral()          // Kotlin, React-Android AAR, etc.
                mavenLocal()            // any locally published artifacts
        }
        plugins {
                // Android application plugin
                id("com.android.application") version "8.1.1" apply false

                // Kotlin Android plugin (optional, if you use Kotlin in your app)
                id("org.jetbrains.kotlin.android") version "1.9.22" apply false

                id("com.facebook.react") version "0.73.5" apply false
        }

        resolutionStrategy {
                eachPlugin {
                        if (requested.id.id == "com.facebook.react") {
                                // point to the source under node_modules
                                useModule("com.facebook.react:react-native-gradle-plugin:0.0.0")
                        }
                }
        }
}

// Pull in the local react-native-gradle-plugin code as a composite build
includeBuild("../node_modules/react-native-gradle-plugin")

dependencyResolutionManagement {
        repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
        repositories {
                google()
                mavenCentral()
                mavenLocal()

                // React Native core AAR (for com.facebook.react:react-android)
                maven { url = uri("$rootDir/../node_modules/react-native/android") }

                // JSC AAR, if you’re using JSC
                maven { url = uri("$rootDir/../node_modules/jsc-android/android") }
        }
}

rootProject.name = "PixelTv"
include(":app")
include(":react-native-webview")
project(":react-native-webview").projectDir = file("../node_modules/react-native-webview/android")
